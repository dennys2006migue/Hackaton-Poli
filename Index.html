<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta | Sistema Inteligente</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1e3a8a; display: flex; align-items: center; justify-content: center; height: 100vh; color: white; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 30px; width: 350px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        h1 { color: #1e3a8a; margin: 10px 0; }
        p { color: #666; margin-bottom: 30px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1e40af; transform: scale(1.02); }
        .logo { font-size: 4rem; color: #2563eb; }
    </style>
</head>
<body>
    <div class="login-box">
        <span class="material-icons logo">recycling</span>
        <h1>EcoRuta</h1>
        <p>Centro de Gestión Urbana</p>
        <input type="text" placeholder="Usuario">
        <input type="password" placeholder="Contraseña">
        <select id="role">
            <option value="ciudadano">Perfil Ciudadano</option>
            <option value="admin">Administrador GAD</option>
        </select>
        <button onclick="login()">INGRESAR AL PANEL</button>
    </div>
    <script>
        function login() {
            const role = document.getElementById('role').value;
            window.location.href = role === 'admin' ? "app-admin/dashboard.html" : "app-ciudadanos/index.html";
        }
    </script>
</body>
</html>
