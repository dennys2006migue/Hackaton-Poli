<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoRuta - Ciudadano</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app-content">
        <section id="map-section" class="app-section active">
            <div class="map-wrapper" style="height: calc(100vh - 75px); width: 100%;">
                <iframe src="../app-admin/mapa.html" frameborder="0" style="width: 100%; height: 100%;"></iframe>
            </div>
        </section>

        <section id="history-section" class="app-section">
            <div class="card">
                <h3>Mis Reportes IA</h3>
                <div id="history-list" style="margin-top: 15px;">
                    <p style="color: #888; text-align: center;">No hay reportes recientes.</p>
                </div>
            </div>
        </section>

        <section id="notifications-section" class="app-section">
            <div class="card">
                <h3>Centro de Alertas y Mensajes</h3>
                <div id="notif-list" style="margin-top: 15px;">
                    <div class="alert">
                        <strong>🌱 ¡Bienvenido!</strong><br>
                        Usa la cámara para reportar residuos.
                    </div>
                </div>
            </div>
        </section>

        <section id="profile-section" class="app-section">
            <div class="card" style="text-align: center;">
                <div class="avatar-large" style="width:70px; height:70px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-size:24px;">MB</div>
                <h2>Melany Bejarani</h2>
                <p>EcoPuntos: <strong style="color: var(--success);">★ 450</strong></p>
                <button class="btn-cancel" onclick="window.location.href='../index.html'" style="margin-top: 20px; width: 100%;">Cerrar Sesión</button>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-btn active" onclick="showSection('map-section', this)">
                <span class="material-icons">map</span><span>Inicio</span>
            </div>
            <div class="nav-btn" onclick="showSection('history-section', this)">
                <span class="material-icons">history</span><span>Historial</span>
            </div>
            <div class="nav-camera" onclick="triggerCamera()">
                <div class="cam-btn"><span class="material-icons">photo_camera</span></div>
            </div>
            <div class="nav-btn" onclick="showSection('notifications-section', this)">
                <span class="material-icons">notifications</span><span>Alertas</span>
            </div>
            <div class="nav-btn" onclick="showSection('profile-section', this)">
                <span class="material-icons">person</span><span>Perfil</span>
            </div>
        </nav>

        <div id="camera-overlay" class="hidden">
            <div class="camera-window">
                <div id="camera-feed">
                    <div id="loader-ia" class="hidden">
                        <div class="scan-line"></div>
                        <p style="position: absolute; bottom: 20px; color: white;">Analizando...</p>
                    </div>
                    <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                    <canvas id="photo-canvas" class="hidden"></canvas>
                </div>
                <div class="camera-controls">
                    <button class="btn-cancel" onclick="closeCamera()">X</button>
                    <button id="btn-capture" class="btn-primary" onclick="takePhoto()" style="flex:1;">CAPTURA</button>
                    <button id="btn-upload" class="btn-upload hidden" onclick="confirmReport()" style="flex:1;">ENVIAR IA</button>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
