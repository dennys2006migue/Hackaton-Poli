<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EcoRuta Admin | GAD Municipal</title>
    <link rel="stylesheet" href="style_admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/paho-mqtt/mqttws31.min.js"></script>
</head>
<body>
<header><h2>🌱 EcoRuta | Centro Inteligente Municipal</h2></header>
<div class="layout">
    <aside class="sidebar">
        <button onclick="showAdmin('resumen')"><i class="fa-solid fa-chart-line"></i> Resumen</button>
        <button onclick="showAdmin('rutas')"><i class="fa-solid fa-map"></i> Rutas</button>
        <button onclick="showAdmin('desechos')"><i class="fa-solid fa-recycle"></i> Desechos</button>
        <button onclick="showAdmin('denuncias')"><i class="fa-solid fa-triangle-exclamation"></i> Alertas IA</button>
        <button onclick="showAdmin('camaras')"><i class="fa-solid fa-video"></i> Cámaras</button>
        <button style="margin-top:auto; color:#ff4d4d;" onclick="window.location.href='../index.html'">Cerrar Sesión</button>
    </aside>
    <main>
        <section id="resumen" class="admin-page active">
            <h3>Resumen Inteligente</h3>
            <div class="stats">
                <div class="stat-card">🚛 Rutas Activas <span>8</span></div>
                <div class="stat-card">♻️ Toneladas <span>12T</span></div>
                <div class="stat-card">🚨 Alertas IA <span id="alertasTotales">0</span></div>
            </div>
        </section>
        <section id="rutas" class="admin-page">
            <h3>Mapa en Tiempo Real</h3>
            <div class="card map-container"><iframe src="mapa.html" id="map-frame" frameborder="0"></iframe></div>
        </section>
        <section id="denuncias" class="admin-page">
            <h3>Centro de Notificaciones IA</h3>
            <div id="listaDenuncias"></div>
        </section>
        <section id="camaras" class="admin-page">
            <h3>Análisis IA - Cámaras</h3>
            <video controls width="100%"><source src="../api-backend/data/test_route.mp4"></video>
            <button class="primary" onclick="analizarVideo()">Simular Análisis en Nube</button>
            <div id="resultadoIA" class="card">Esperando conexión...</div>
        </section>
    </main>
</div>
<script src="admin.js"></script>
</body>
</html>
